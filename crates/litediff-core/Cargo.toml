[package]
name = "litediff-core"
description = "Pure-Rust diff engine for LiteDiff: line alignment, Myers/Patience line diff, token-level intra-line diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "litediff_core"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[features]
default = []
# Enables the IPC payload types and serde derives on the core model. Kept out of
# the default build so the engine stays dependency-free for CLI/tests.
serde = ["dep:serde"]

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]
