[package]
name = "litediff-app"
description = "LiteDiff desktop shell: file IO and IPC on top of the diff engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "litediff_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
litediff-core = { path = "../litediff-core", features = ["serde"] }
# `custom-protocol` is what makes Tauri serve the frontend from inside the binary.
# Without it the app starts, opens a window, and shows a blank white page: there is
# no dev server in a release build and no embedded assets to fall back to.
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
getrandom = "0.3"

[features]
default = []
